services:
  app:
    build: ./app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    env_file:
      - .env
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
      - client
